name: Release APK

# Push a tag like v1.0 (or run manually) to build the debug-signed APK and attach it to a
# GitHub Release. The APK is signed with the committed debug keystore, so releases install as
# updates over one another.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/armored-llama-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Debug-signed APK for **arm64-v8a** Android phones (Android 8.0 / API 26+).

            Sideload it directly — no build needed. Bundles llama.cpp `b9775`; you can update the
            runtime in-app (Menu → Update llama.cpp) or download models from Hugging Face inside the app.

            > Heads up: on a phone, stick to ~4B models (e.g. gemma-4 E2B). Bigger models run but are slow.
